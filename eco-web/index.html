<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MyEco Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/sensors.css">
    <link rel="stylesheet" href="css/history.css">
</head>
<body>
    <div class="app-wrapper">
        <aside class="sidebar">
            <nav class="side-nav">
                <div class="nav-item active">
                    <i class="fas fa-th-large"></i> Dashboard
                </div>
                <div class="nav-item">
                    <i class="fas fa-microchip"></i> Sensors
                </div>
                <div class="nav-item">
                    <i class="fas fa-history"></i> History
                </div>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h2>MyEco Control Panel</h2>
                <div class="system-status">
                    <span class="status-dot"></span>
                    <span class="status-text">System:</span> Online
                </div>
            </header>

            <div id="page-content" class="content-area">
                <div id="dash-page">
                    <div class="sensor-grid">
                        <div class="card">
                            <h3>CO2 Level</h3>
                            <p>450 ppm</p>
                        </div>
                    </div>
                </div>

                <div id="sensors-page" style="display: none;">
                    <h2>Sensor Management</h2>
                    <p>Scanning for devices...</p>
                </div>

                <div id="history-page" style="display: none;">
                    <h2>System History</h2>
                    <p>No records found.</p>
                </div>
            </div>
        </main>
    </div>
    <script src="web-app.js"></script>
</body>
</html>
