<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MyEco Monitor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <h1>MyEco - Air Control</h1>
        <div class="sensor-display">
            <div class="card">
                <h3>CO2 Level</h3>
                <p id="co2-value">Loading...</p>
                <div id="co2-status" class="status">Waiting</div>
            </div>
            <div class="card">
                <h3>Temperature</h3>
                <p id="temp-value">Loading...</p>
                <div id="temp-status" class="status">Waiting</div>
            </div>
            <div class="card">
                <h3>Humidity</h3>
                <p id="hum-value">Loading...</p>
                <div id="hum-status" class="status">Waiting</div>
            </div>
        </div>
        
        <button id="update-btn">Update Data</button>

        <div class="log-section">
            <h3>Recent Activity</h3>
            <ul id="log-list">
                <li>System started...</li>
                <li>Sensor check: OK</li>
            </ul>
        </div>
    </div>
    <script src="web-app.js"></script>
</body>
</html>
