<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MyEco Monitor</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="main-wrapper">
        <header class="top-header">
            <h1>MyEco - Air Control</h1>
        </header>

        <main class="content-area">
            <div class="sensor-grid">
                <div class="card">
                    <h3>CO2 Level</h3>
                    <p id="co2-value">Loading...</p>
                    <div id="co2-status" class="status">Waiting</div>
                </div>
                <div class="card">
                    <h3>Temperature</h3>
                    <p id="temp-value">Loading...</p>
                    <div id="temp-status" class="status">Waiting</div>
                </div>
                <div class="card">
                    <h3>Humidity</h3>
                    <p id="hum-value">Loading...</p>
                    <div id="hum-status" class="status">Waiting</div>
                </div>
            </div>

            <div class="actions">
                <button id="update-btn">Update Data</button>
            </div>

            <div class="history-log">
                <h4>Activity Log</h4>
                <ul id="log-list">
                    <li>System initialized...</li>
                </ul>
            </div>
        </main>
    </div>
    <script src="web-app.js"></script>
</body>
</html>
